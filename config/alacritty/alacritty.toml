# ──────────────────────────────────────────────
#   Alacritty — JetBrainsMono Nerd 12, 25px padding to mirror
#   Foot (borderless, beam blink cursor, zsh). Colors come from
#   matugen: config/matugen/templates/alacritty.toml
#   → ~/.config/alacritty/colors.toml
# ──────────────────────────────────────────────
[general]
import = ["~/.config/alacritty/colors.toml"]

[terminal]
shell = "zsh"

[font]
size = 12

[font.normal]
family = "JetBrainsMono Nerd Font"
style = "Regular"

[font.bold]
family = "JetBrainsMono Nerd Font"
style = "Bold"

[font.italic]
family = "JetBrainsMono Nerd Font"
style = "Italic"

[window]
padding = { x = 25, y = 25 }
opacity = 0.92
decorations = "none"

[cursor]
style = { shape = "Beam", blinking = "On" }
blink_interval = 500

[scrolling]
history = 10000

[selection]
save_to_clipboard = true

[keyboard]
bindings = [
  { key = "Insert", mods = "Control", action = "Copy" },
  { key = "Insert", mods = "Shift", action = "Paste" },
]
