# ── swayidle (Void port of hypridle.conf) ──
# lock 180s, screen off 240s, suspend 600s, dim at 150s.
timeout 150 'brightnessctl -s set 10%' resume 'brightnessctl -r'
timeout 180 'exec ~/.config/sway/scripts/lock.sh'
timeout 240 'swaymsg "output * power off"' resume 'swaymsg "output * power on"'
timeout 600 'loginctl suspend'
before-sleep 'exec ~/.config/sway/scripts/lock.sh'
lock 'exec ~/.config/sway/scripts/lock.sh'
