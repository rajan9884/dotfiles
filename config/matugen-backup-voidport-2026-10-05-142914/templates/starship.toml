# ~/.config/starship.toml — GENERATED by matugen, do not edit directly.
#   Source template (versioned): dotfiles/config/matugen/templates/starship.toml (ported from Void floating preset)
#   Regenerated from the current wallpaper on every switch
#   (swww-all.sh → `matugen image …`, scheme-content).
#   Edit the template, then re-run swww-all.sh or matugen to apply.

"$schema" = 'https://starship.rs/config-schema.json'

palette = "matugen"

# Don't print a new line at the start of the prompt
add_newline = false

format = """
$cmd_duration $directory$git_branch
  $character"""

[palettes.matugen]
primary = "{{colors.primary.default.hex}}"
on_primary = "{{colors.on_primary.default.hex}}"
secondary = "{{colors.secondary.default.hex}}"
on_secondary = "{{colors.on_secondary.default.hex}}"
tertiary = "{{colors.tertiary.default.hex}}"
error = "{{colors.error.default.hex}}"
surface = "{{colors.surface.default.hex}}"
on_surface_variant = "{{colors.on_surface_variant.default.hex}}"

[fill]
symbol = '-'
style = 'fg:on_surface_variant'

[character]
success_symbol = "[ ](bold tertiary)"
error_symbol = "[ ](bold error)"

# Disable the package module, hiding it from the prompt completely
[package]
disabled = true

[git_branch]
style = "bg:secondary"
symbol = "󰘬"
truncation_length = 12
truncation_symbol = ""
format = " 󰜥 [](bold fg:secondary)[$symbol $branch(:$remote_branch)](fg:on_secondary bg:secondary)[ ](bold fg:secondary)"

[git_commit]
commit_hash_length = 4
tag_symbol = " "

[git_state]
format = '[\($state( $progress_current of $progress_total)\)]($style) '
cherry_pick = "[🍒 PICKING](bold red)"

[git_status]
conflicted = " 🏳 "
ahead = " 🏎💨 "
behind = " 😰 "
diverged = " 😵 "
untracked = " 🤷 ‍"
stashed = " 📦 "
modified = " 📝 "
staged = '[++\($count\)](green)'
renamed = " ✍️ "
deleted = " 🗑 "

[hostname]
ssh_only = false
format = "[•$hostname](bg:secondary bold fg:on_secondary)[](bold fg:secondary)"
trim_at = ".companyname.com"
disabled = false

[line_break]
disabled = false

[memory_usage]
disabled = true
threshold = -1
symbol = " "
style = "bold dimmed green"

[time]
disabled = true
format = '🕙[\[ $time \]]($style) '
time_format = "%T"

[username]
style_user = "bold bg:secondary fg:on_secondary"
style_root = "red bold"
format = "[](bold fg:secondary)[$user]($style)"
disabled = false
show_always = true

[directory]
home_symbol = " "
read_only = "  "
style = "bg:primary fg:on_primary"
truncation_length = 2
truncation_symbol = ".../"
format = '[](bold fg:primary)[󰉋 → $path]($style)[](bold fg:primary)'

[directory.substitutions]
"Desktop" = "  "
"Documents" = "  "
"Downloads" = "  "
"Music" = " 󰎈 "
"Pictures" = "  "
"Videos" = "  "
"GitHub" = " 󰊤 "

[cmd_duration]
min_time = 0
format = '[](bold fg:secondary)[󰪢 $duration](bold bg:secondary fg:on_secondary)[](bold fg:secondary)'
