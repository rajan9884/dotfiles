# ~/.config/starship.toml — GENERATED by matugen, do not edit directly.
#   Source template (versioned): dotfiles/config/matugen/templates/starship.toml
#   Regenerated from the current wallpaper on every switch
#   (swww-all.sh → `matugen image …`, dark scheme-content).
#
# Powerline layout themed with matugen roles (truecolor hexes, not ANSI
# names): the prompt follows the wallpaper in every terminal — Ghostty,
# Kitty, bash, and Zed, whose Aura theme palette no longer matters.
# NOTE: this design needs a Nerd Font for the  separators and icons
# (system terminals have one; Zed's Dank Mono does not — tofu expected
# there until its terminal font is switched).

"$schema" = 'https://starship.rs/config-schema.json'

palette = "matugen"

format = """
[░▒▓](primary)\
$os\
[](bg:secondary fg:primary)\
$directory\
[](fg:secondary bg:primary_container)\
$git_branch\
$git_status\
[](fg:primary_container bg:secondary_container)\
$nodejs\
$bun\
$rust\
$golang\
$php\
[](fg:secondary_container bg:surface)\
$time\
[ ](fg:surface)\
\n$character"""

[palettes.matugen]
primary = "{{colors.primary.default.hex}}"
on_primary = "{{colors.on_primary.default.hex}}"
primary_container = "{{colors.primary_container.default.hex}}"
secondary = "{{colors.secondary.default.hex}}"
on_secondary = "{{colors.on_secondary.default.hex}}"
secondary_container = "{{colors.secondary_container.default.hex}}"
tertiary = "{{colors.tertiary.default.hex}}"
error = "{{colors.error.default.hex}}"
surface = "{{colors.surface.default.hex}}"
on_surface_variant = "{{colors.on_surface_variant.default.hex}}"

[character]
success_symbol = "[❯](bold tertiary)"
error_symbol = "[❯](bold error)"

[directory]
style = "fg:on_secondary bg:secondary"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = " "
"Pictures" = " "

[git_branch]
symbol = ""
style = "bg:primary_container"
format = '[[ $symbol $branch ](fg:primary bg:primary_container)]($style)'

[git_status]
style = "bg:primary_container"
format = '[[($all_status$ahead_behind )](fg:primary bg:primary_container)]($style)'

[nodejs]
symbol = ""
style = "bg:secondary_container"
format = '[[ $symbol ($version) ](fg:secondary bg:secondary_container)]($style)'

[bun]
symbol = ""
style = "bg:secondary_container"
format = '[[ $symbol ($version) ](fg:secondary bg:secondary_container)]($style)'

[rust]
symbol = ""
style = "bg:secondary_container"
format = '[[ $symbol ($version) ](fg:secondary bg:secondary_container)]($style)'

[golang]
symbol = ""
style = "bg:secondary_container"
format = '[[ $symbol ($version) ](fg:secondary bg:secondary_container)]($style)'

[php]
symbol = ""
style = "bg:secondary_container"
format = '[[ $symbol ($version) ](fg:secondary bg:secondary_container)]($style)'

[time]
disabled = false
time_format = "%R" # Hour:Minute Format
style = "bg:surface"
format = '[[  $time ](fg:on_surface_variant bg:surface)]($style)'

[os]
style = "bg:primary fg:on_primary"
format = "[ $symbol ]($style)"
disabled = false

[os.symbols]
Windows = "󰍲"
Ubuntu = "󰕈"
SUSE = ""
Raspbian = "󰐿"
Mint = "󰣭"
Macos = "󰀵"
Manjaro = ""
Linux = "󰌽"
Gentoo = "󰣨"
Fedora = "󰣛"
Alpine = ""
Amazon = ""
Android = ""
AOSC = ""
Arch = "󰣇"
Artix = "󰣇"
EndeavourOS = ""
CentOS = "󰣚"
Debian = "󰣚"
Redhat = ""
RedHatEnterprise = ""
Pop = ""

[nix_shell]
disabled = true
