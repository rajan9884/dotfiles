# ──────────────────────────────────────────────
#   mako — minimal Wayland notification daemon.
#   Generated by matugen per wallpaper; do NOT edit.
#   Source: config/matugen/templates/mako.conf
# ──────────────────────────────────────────────
font=JetBrainsMono Nerd Font 10
background-color=#{{colors.surface_container.default.hex_stripped}}
text-color=#{{colors.on_surface.default.hex_stripped}}
border-color=#{{colors.primary.default.hex_stripped}}
progress-color=#{{colors.primary.default.hex_stripped}}
border-size=2
border-radius=12
padding=12
margin=10
width=360
max-visible=5
default-timeout=5000
ignore-timeout=0
layer=overlay
anchor=top-right
on-button-left=dismiss
on-button-right=dismiss-all
on-button-middle=none
group-by=summary
markup=1
actions=1
history=1

[urgency=high]
border-color=#{{colors.error.default.hex_stripped}}
default-timeout=0

[mode=do-not-disturb]
invisible=1
