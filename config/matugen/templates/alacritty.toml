# ──────────────────────────────────────────────
#   Alacritty colors — generated by matugen per wallpaper.
#   Do NOT edit: source is config/matugen/templates/alacritty.toml
# ──────────────────────────────────────────────
[colors.primary]
background = "#{{colors.surface.default.hex_stripped}}"
foreground = "#{{colors.on_surface.default.hex_stripped}}"
dim_foreground = "#{{colors.on_surface_variant.default.hex_stripped}}"
bright_foreground = "#{{colors.on_surface.default.hex_stripped}}"

[colors.cursor]
text = "#{{colors.on_primary.default.hex_stripped}}"
cursor = "#{{colors.primary.default.hex_stripped}}"

[colors.selection]
text = "#{{colors.on_secondary_container.default.hex_stripped}}"
background = "#{{colors.secondary_container.default.hex_stripped}}"

[colors.normal]
black = "#{{colors.surface.default.hex_stripped}}"
red = "#{{colors.error.default.hex_stripped}}"
green = "#{{colors.tertiary.default.hex_stripped}}"
yellow = "#{{colors.secondary.default.hex_stripped}}"
blue = "#{{colors.primary.default.hex_stripped}}"
magenta = "#{{colors.tertiary_fixed.default.hex_stripped}}"
cyan = "#{{colors.primary_fixed.default.hex_stripped}}"
white = "#{{colors.on_surface.default.hex_stripped}}"

[colors.bright]
black = "#{{colors.outline.default.hex_stripped}}"
red = "#{{colors.error.default.hex_stripped}}"
green = "#{{colors.tertiary.default.hex_stripped}}"
yellow = "#{{colors.secondary.default.hex_stripped}}"
blue = "#{{colors.primary.default.hex_stripped}}"
magenta = "#{{colors.tertiary_fixed.default.hex_stripped}}"
cyan = "#{{colors.primary_fixed.default.hex_stripped}}"
white = "#{{colors.on_surface_variant.default.hex_stripped}}"
