# ──────────────────────────────────────────────
#   Foot Terminal – Optimized Aesthetic
#   (JetBrainsMono Nerd Font 12, 25px padding,
#   borderless, 0.92 opacity, beam blink cursor,
#   10000 scrollback, no bell, zsh)
#   Dynamic colors come from matugen:
#   config/matugen/templates/foot.ini → ~/.config/foot/colors.ini
# ──────────────────────────────────────────────

shell=zsh
font=JetBrainsMono Nerd Font:size=12
pad=25x25

include=~/.config/foot/colors.ini

[scrollback]
lines=10000

[bell]
system=no
urgent=no
notify=no
visual=no

[cursor]
style=beam
blink=yes
blink-rate=500

[csd]
preferred=none

[key-bindings]
# Mirror the universal clipboard chords from Hyprland
# (SUPER+C/V → CTRL+Insert / SHIFT+Insert)
primary-paste=none
clipboard-copy=Control+Insert
clipboard-paste=Shift+Insert
