general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = pidof hyprlock || hyprlock
    after_sleep_cmd = hyprctl dispatch "hl.dsp.dpms({ action = 'on' })"
    inhibit_sleep = 3
    # Respect app inhibits (Firefox video-playing, Brave Video Wake Lock,
    # Wayland idle-inhibit from fullscreen rule). Do not ignore.
    ignore_dbus_inhibit = false
    ignore_systemd_inhibit = false
    ignore_wayland_inhibit = false
}

# Dim screen to save battery (restores on activity)
listener {
    timeout = 150
    on-timeout = brightnessctl -s set 10%
    on-resume = brightnessctl -r
}

# Lock after 3 min idle
listener {
    timeout = 180
    on-timeout = pidof hyprlock || hyprlock
}

# Screen off after 4 min idle
listener {
    timeout = 240
    on-timeout = hyprctl dispatch "hl.dsp.dpms({ action = 'off' })"
    on-resume = hyprctl dispatch "hl.dsp.dpms({ action = 'on' })"
}

# Suspend after 10 min idle to save battery
listener {
    timeout = 600
    on-timeout = loginctl suspend
}
