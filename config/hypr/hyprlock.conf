# Profile-Photo
image {
    monitor =
    path = /home/rajan/Personal/DOC/profile.jpeg
    border_color = 0xffdddddd
    border_size = 0
    size = 200
    rounding = -1
    rotate = 0
    reload_time = -1
    reload_cmd =
    position = 0, -20
    halign = center
    valign = center
}

# USER
label {
    monitor =
    text = Hi, $USER
    color = $on_surface
    font_size = 25
    font_family = JetBrains Mono
    position = 0, -158
    halign = center
    valign = center
}

