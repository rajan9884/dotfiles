# ── Hyprlock (garmx-style layout, staged wallpaper + DOC profile) ──
# Label colors come from matugen ($on_surface etc.), regenerated
# on every wallpaper switch, so text adapts to bright/dark walls.
source = ~/.config/hypr/hyprlock-colors.conf

# BACKGROUND (staged per wallpaper switch by swww-all.sh so the
# lock screen always matches the current wallpaper).
background {
    monitor =
    path = /home/rajan/.cache/hyprlock-bg.jpg
    blur_passes = 0
    contrast = 0.8916
    brightness = 0.7
    vibrancy = 0.1696
    vibrancy_darkness = 0.0
}

# GENERAL
general {
    no_fade_in = false
    grace = 0
    disable_loading_bar = false
    hide_cursor = true
    ignore_empty_input = true
}

# INPUT FIELD
input-field {
    monitor =
    size = 250, 60
    outline_thickness = 2
    dots_size = 0.2
    dots_spacing = 0.2
    dots_center = true
    outer_color = $outline
    inner_color = rgba(0, 0, 0, 0.35)
    font_color = $on_surface
    check_color = $primary
    fail_color = $error
    fail_text =  wrong password
    fade_on_empty = false
    font_family = JetBrains Mono
    placeholder_text = Enter Pass
    hide_input = false
    position = 0, -225
    halign = center
    valign = center
}

# Time
label {
    monitor =
    text = cmd[update:1000] echo "<span>$(date +"%H:%M")</span>"
    color = $on_surface
    font_size = 130
    font_family = JetBrains Mono
    position = 0, 240
    halign = center
    valign = center
}

# Day-Month-Date
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%A, %d %B")"
    color = $on_surface
    font_size = 30
    font_family = JetBrains Mono
    position = 0, 105
    halign = center
    valign = center
}

