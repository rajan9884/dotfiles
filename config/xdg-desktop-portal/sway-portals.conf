# Portal routing for sway/wlroots sessions.
# Without this, xdg-desktop-portal defaults to the GNOME backend
# (org.gnome.Mutter.ScreenCast is unavailable under sway), so screen
# sharing in Chromium/OBS and screenshots time out.
[preferred]
default=gtk
org.freedesktop.impl.portal.ScreenCast=wlr
org.freedesktop.impl.portal.Screenshot=wlr
org.freedesktop.impl.portal.Secret=gnome-keyring
