# Native Wayland + Intel GPU (Iris Xe RPL-P, Mesa 26.2.4)
# Arch chromium launcher reads ~/.config/chromium-flags.conf automatically.
# NOTE: Do NOT use --use-angle=swiftshader — that's CPU software rendering and causes lag.
--ozone-platform-hint=auto
--ignore-gpu-blocklist
--enable-zero-copy
--enable-features=AcceleratedVideoDecodeLinuxGL,VaapiVideoDecoder,VaapiIgnoreDriverChecks,Vulkan,VulkanFromANGLE,DefaultANGLEVulkan
