# ~/.config/starship.toml — Arch dotfiles.
#
# Defaults everywhere except the custom nix-shell detector. zsh uses its own
# hand-rolled prompt (see shell/zshrc); this file drives bash (via
# `eval "$(starship init bash)"`) and any other Starship-ready shell.

[nix_shell]
disabled = true

[custom.nix-shell]
# Detects legacy `nix-shell` / `nix develop` (via $IN_NIX_SHELL / $NIX_TRY_SHELL)
# AND new `nix shell` (sets no marker var — only prepends /nix/store to PATH).
command = "echo ❄️ nix-shell"
when = 'test -n "$IN_NIX_SHELL$NIX_TRY_SHELL" || case ":$PATH:" in *:/nix/store/*) true;; *) false;; esac'
format = "via [$output]($style) "
style = "bold cyan"